name: Check Notebooks
on:
  pull_request:
    paths:
      - 'colabs/**/*.ipynb'
      - '.github/workflows/cleanup.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install Dependencies
        run: |
          python -m pip install nb_helpers 'fastcore<1.8'
      - name: Check changed notebooks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          git diff --no-renames --name-only --diff-filter=AM -z "${BASE_SHA}...${HEAD_SHA}" -- ':(glob)colabs/**/*.ipynb' > "$RUNNER_TEMP/changed-notebooks"
          mapfile -d '' -t notebooks < "$RUNNER_TEMP/changed-notebooks"
          if [ "${#notebooks[@]}" -eq 0 ]; then
            echo "No changed notebooks to check"
            exit 0
          fi
          for notebook in "${notebooks[@]}"; do
            nb_helpers.fix_nbs "$notebook" --branch "$BASE_BRANCH"
          done
          git diff --exit-code -- "${notebooks[@]}"
