[project]
name = "weave-cookbook"
version = "0.1.0"
description = "Runnable W&B Weave cookbook examples in Python"
authors = [{ name = "Lorenzo Balderrama" }]
requires-python = ">=3.11"
dependencies = [
    "openai>=2.52.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "python-dotenv>=1.2.2",
    "weave>=0.53.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits W&B services; opt in with RUN_LIVE_TESTS=1 and run with -m live",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["shared"]
